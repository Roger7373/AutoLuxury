function total(x){return Math.max(0,Math.round((x.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.rate||0),0)*100)/100-Number(x.discount||0))}function nextNo(){return 'CB-'+String(db.cbNext).padStart(4,'0')}function newInvoice(){editing=null;draft={id:uid(),no:nextNo(),date:new Date().toLocaleDateString('en-CA'),customer:'',customerPhone:'',customerAddress:'',plate:'',carModel:'',year:'',remark:'',discount:0,items:[],draft:true,versions:[]};go('editor')}

function saveInvoice(isDraft){sync();if(!draft.customer.trim())return alert('请填写客户名称');if(!draft.items.length)return alert('请至少添加一个商品 / 服务');if(draft.items.some(x=>!x.description.trim()))return alert('请填写全部商品名称');if(db.invoices.some(x=>x.id!==draft.id&&x.no===draft.no))return alert('Cash Bill 编号重复，请更改编号');for(let x of draft.items){if(x.source){let k;try{k=JSON.parse(x.source)}catch{continue}let r=db.rates.find(y=>y.category===k.category&&y.description===k.description&&(y.partNo||'')===(k.partNo||''));if(r&&Number(r.rate)!==Number(x.rate)&&confirm(`${x.description} 的价格已改为 ${rm(x.rate)}。是否同时更新商品价格库？`))r.rate=x.rate}}draft.draft=isDraft;let old=db.invoices.find(x=>x.id===draft.id);if(old){draft.versions=old.versions||[];draft.versions.push({...structuredClone(old),versions:undefined,archivedAt:new Date().toISOString()});db.invoices=db.invoices.map(x=>x.id===draft.id?structuredClone(draft):x)}else{db.next++;db.cbNext++;db.invoices.push(structuredClone(draft))}if(!save())return;preview=draft.id;go('preview')}
function openPreview(id){preview=id;go('preview')}
function v2Estimate(it){let n=String(it.description||'').length+String(it.partNo||'').length+String(it.brand||'').length;return 35+Math.max(0,Math.ceil(n/62)-1)*15+Math.max(0,(String(it.description||'').match(/\n/g)||[]).length)*14}
function invoicePages(x){const arr=x.items||[],groups=[];let current=[],used=0;arr.forEach((it,index)=>{let h=v2Estimate(it),lim=groups.length?640:530;if(current.length && (used+h>lim||current.length>=14)){groups.push(current);current=[];used=0}current.push({it,index});used+=h});if(current.length||!groups.length)groups.push(current);let g=groups[groups.length-1];let size=g.reduce((s,r)=>s+v2Estimate(r.it),0);let limit=groups.length===1?345:475;let tail=[];while(g.length>1&&size>limit){let row=g.pop();tail.unshift(row);size-=v2Estimate(row.it)}if(tail.length)groups.push(tail);return groups}
function v2KV(label,val){return `<div class="v2-kv"><span>${label}</span><span>:</span><span>${esc(val||'')}</span></div>`}
function invoiceSheet(x,s,rows,p,totalPages){let last=p===totalPages-1;let contact=[s.address,s.phone].filter(Boolean).map(esc).join('<br>');let brand=`<div class="v2-head"><div class="v2-company"><img class="v2-brand-image v2-brand-image-big" src="${V2_LOGO}" alt="AUTO LUXURY CAR ACCESSORIES"><div class="v2-company-details">${contact}</div></div><div class="v2-head-right v2-head-right-clean"><div class="v2-cash-title-wrap"><div class="v2-cash-title">CASH BILL</div></div><div class="v2-invoice-meta v2-invoice-meta-clean"><div class="v2-meta-grid"><span>Cash Bill No.</span><strong>${esc(x.no)}</strong><span>Date</span><span>${esc(x.date)}</span></div><div class="v2-date-page">Page ${p+1} of ${totalPages}</div></div></div></div>`;
let info=p===0?`<div class="v2-customer-wrap"><div class="v2-info"><div class="v2-info-title">BILL TO</div><div class="v2-info-body">${v2KV('Customer Name',x.customer)}${v2KV('Phone No.',x.customerPhone)}${v2KV('Address',x.customerAddress)}</div></div><div class="v2-info"><div class="v2-info-title">VEHICLE DETAILS <span style="font-size:10px;font-weight:normal">(Optional)</span></div><div class="v2-info-body">${v2KV('Plate No.',x.plate)}${v2KV('Car Model',x.carModel)}${v2KV('Year',x.year)}</div></div></div>`:'<div style="height:23px"></div>';
let table=`<table class="v2-items"><colgroup><col style="width:6%"><col style="width:30%"><col style="width:22%"><col style="width:9%"><col style="width:16%"><col style="width:17%"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Part No. / Brand</th><th>Qty</th><th>Unit Price (RM)</th><th>Amount (RM)</th></tr></thead><tbody>${rows.map(({it,index})=>`<tr><td class="v2-num">${index+1}</td><td class="v2-desc">${esc(it.description)}${it.size&&!it.partNo?`<small>${esc(it.size)}</small>`:''}</td><td>${esc([it.partNo,it.brand].filter(Boolean).join(' / '))}</td><td class="v2-num">${esc(it.qty)}${it.unit&&it.unit!=='pcs'?`<small>${esc(it.unit)}</small>`:''}</td><td class="v2-money">${Number(it.rate||0).toFixed(2)}</td><td class="v2-money">${(Number(it.qty||0)*Number(it.rate||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
let subtotal=x.items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.rate||0),0);let bottom=last?`<div class="v2-bottom"><div class="v2-bottom-top v2-bottom-top-single"><div class="v2-totals"><div class="v2-total-line"><span>Subtotal</span><span>${rm(subtotal)}</span></div><div class="v2-total-line"><span>Discount</span><span>${rm(x.discount)}</span></div><div class="v2-grand-total"><span>Total Amount</span><span>${rm(total(x))}</span></div></div></div><div class="v2-last-bottom"><div class="v2-bank-box"><div class="v2-box-title">BANK DETAILS</div><div class="v2-bank-data"><strong>${esc(s.bank||'')}</strong>${v2KV('Account No.',s.account)}${v2KV('Account Name',s.holder)}</div></div><div class="v2-authorization"><div class="stamp-wrap">${s.chop?`<img class="stamp-chop" src="${s.chop}" alt="Company Chop">`:''}${s.signature?`<img class="stamp-signature" src="${s.signature}" alt="Signature">`:''}</div><div class="v2-sign-rule"></div><span>Authorized Signature &amp; Company Chop</span></div></div></div>`:`<div class="v2-continuation">Continued on next page →</div>`;
return `<section class="v18-page v2-page">${brand}${info}${table}${bottom}<img class="v2-foot-strip" src="${V2_FOOTER}" alt="Car Accessories · Window Tint · Audio System · Safety Devices · Car Care"></section>`}
function showPreview(){let x=db.invoices.find(y=>y.id===preview);if(!x)return go('invoices');let s=db.settings,groups=invoicePages(x);app.innerHTML=`<div class="no-print card row"><b>${esc(x.no)} · ${x.draft?'草稿':'正式'} ${x.void?'（已作废）':''}</b><span><button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div><div id="paper">${groups.map((g,p)=>invoiceSheet(x,s,g,p,groups.length)).join('')}</div><div class="card no-print"><button onclick="exportInvoicePDF()">导出 PDF</button> <button class="alt" onclick="printInvoice()">打印</button> <button class="alt" onclick="shareInvoice()">分享</button> <button class="alt" onclick="historyView('${x.id}')">历史版本 (${x.versions?.length||0})</button> <button class="danger" onclick="voidInvoice('${x.id}')">作废</button><p class="muted">Auto Luxury Cash Bill · 汇总、银行与签名仅最后一页显示。</p></div>`;let host=document.getElementById('paper');let apply=()=>{let w=Math.min(794,host.clientWidth);let scale=w/794;host.querySelectorAll('.v18-page').forEach(el=>{el.style.transformOrigin='top left';el.style.transform=`scale(${scale})`;el.style.marginLeft='0';el.style.marginBottom=(1123*(scale-1)+18)+'px'});host.style.width='100%'};apply()}
let pdfLoading=null;
function loadPdfLibrary(){
 if(typeof window.html2canvas==='function' && window.jspdf?.jsPDF)return Promise.resolve();
 if(pdfLoading)return pdfLoading;
 const loadScript=(url,check)=>new Promise((resolve,reject)=>{
  if(check())return resolve();
  const script=document.createElement('script');script.src=url;
  script.onload=()=>check()?resolve():reject(Error('PDF library initialization failed'));
  script.onerror=()=>reject(Error('PDF library download failed; check internet connection'));
  document.head.appendChild(script);
 });
 pdfLoading=Promise.all([
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>typeof window.html2canvas==='function'),
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>typeof window.jspdf?.jsPDF==='function')
 ]).catch(e=>{pdfLoading=null;throw e});
 return pdfLoading;
}
async function buildInvoicePDF(){
 const x=db.invoices.find(y=>y.id===preview);if(!x)throw Error('请先打开 Cash Bill 预览');await loadPdfLibrary();
 const frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.style.cssText='position:fixed;left:0;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none;z-index:-1';document.body.appendChild(frame);
 try{const doc=frame.contentDocument;const css=document.querySelector('style').textContent;
 doc.open();doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style><style>html,body{margin:0!important;padding:0!important;width:794px!important;background:white!important}.v18-page{width:794px!important;height:1123px!important;box-shadow:none!important;margin:0!important;transform:none!important}.v18-page .v18-last{bottom:38px!important;left:40px!important;right:40px!important}</style></head><body></body></html>');doc.close();
 const groups=invoicePages(x),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
 for(let i=0;i<groups.length;i++){doc.body.innerHTML=invoiceSheet(x,db.settings,groups[i],i,groups.length);let sheet=doc.querySelector('.v18-page');await Promise.all(Array.from(sheet.querySelectorAll('img')).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));if(doc.fonts?.ready)await doc.fonts.ready;
 const canvas=await window.html2canvas(sheet,{scale:1.7,backgroundColor:'#fff',useCORS:true,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123});if(i)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',0,0,210,297);
 }
 return {blob:pdf.output('blob'),filename:x.no+'.pdf'};
 }finally{frame.remove()}
}
async function exportInvoicePDF(){
 const btn=document.querySelector('button[onclick="exportInvoicePDF()"]');
 if(btn){btn.disabled=true;btn.textContent='正在生成 PDF…'}
 try{
  const {blob,filename}=await buildInvoicePDF();
  const file=new File([blob],filename,{type:'application/pdf'});
  if(navigator.canShare?.({files:[file]})&&navigator.share){
   try{await navigator.share({files:[file],title:filename});return}catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){console.error(e);alert('PDF 导出失败：'+e.message+'。请在 Safari 中重试。')}
 finally{if(btn){btn.disabled=false;btn.textContent='导出 PDF'}}
}
async function printInvoice(){
 // Use the same PDF renderer for print, avoiding the separate iPhone print CSS path.
 try{
  const {blob}=await buildInvoicePDF();
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(e){alert('打开打印 PDF 失败：'+e.message)}
}

function delRate(i){if(confirm('删除此商品？')){db.rates.splice(i,1);save();rates()}}
function customers(){app.innerHTML=`<div class="card"><h2>新增客户</h2>${field('客户 / 公司名称','c_name')}${field('电话','c_phone')}<label>地址</label><textarea id="c_address" rows="2"></textarea><button onclick="addCustomer()">保存客户</button></div><div class="card"><input id="customerFind" placeholder="搜索客户" oninput="customerRows()"></div><div id="customerRows"></div>`;customerRows()}
function customerRows(){let q=v('customerFind').toLowerCase();document.getElementById('customerRows').innerHTML=db.customers.map((x,i)=>({...x,i})).filter(x=>(x.name+x.phone).toLowerCase().includes(q)).map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.address)}</div></div><span><button class="small alt" onclick="editCustomer(${x.i})">修改</button> <button class="small danger" onclick="deleteCustomer(${x.i})">删除</button></span></div>`).join('')||'<div class="card muted">暂无客户</div>'}
function addCustomer(){if(!v('c_name'))return;db.customers.push({name:v('c_name'),phone:v('c_phone'),address:v('c_address')});save();customers()}
function editCustomer(i){let x=db.customers[i];x.name=prompt('客户名称',x.name)??x.name;x.phone=prompt('电话',x.phone)??x.phone;x.address=prompt('地址',x.address)??x.address;save();customers()}
function deleteCustomer(i){if(confirm('删除客户？')){db.customers.splice(i,1);save();customers()}}
function settings(){let s=db.settings;app.innerHTML=`<div class="card"><h2>店铺资料</h2><p class="muted">已使用正式橙黑色 AUTO LUXURY Logo。地址与电话由你自己填写，不会使用样板上的示例。</p>${field('Company Name','s_company',s.company)}<label>Address</label><textarea id="s_address">${esc(s.address)}</textarea>${field('Contact Number','s_phone',s.phone)}<h2>银行资料</h2>${field('Bank Name','s_bank',s.bank)}${field('Account Number','s_account',s.account)}${field('Account Holder','s_holder',s.holder)}<button onclick="saveSettings()">保存设置</button></div><div class="card"><h2>电子签名</h2><p class="muted">用手指在下方签名，保存后自动显示在 Cash Bill PDF 中。</p><canvas id="sign"></canvas><div class="row"><button class="alt" onclick="clearSign()">清除重签</button><button onclick="saveSign()">保存签名</button></div></div><div class="card"><h2>Company Chop 公司印章</h2><p class="muted">上传你自己的透明 PNG 公司印章。未上传时不会出现示例蓝色印章。</p><div style="max-width:310px;background:#fff;border:1px dashed #ddd;padding:12px"><img id="chopPreview" src="${s.chop||''}" style="width:100%;height:auto"></div><label>上传印章</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadChop(event)"><button class="alt" onclick="resetChop()">清除公司印章</button></div><div class="card"><h2>本机资料备份</h2><p class="muted">V2 继续读取 V1 本地资料，但请在更新前先导出备份 JSON。换手机或清除 Safari 网站数据可能造成资料丢失。</p><button onclick="backup()">导出备份 JSON</button> <label>导入备份 JSON</label><input type="file" accept="application/json" onchange="restore(event)"></div><div class="card"><b>下一个 Cash Bill：${nextNo()}</b><p class="muted">永久连续编号，不包含年份。无税务、无付款状态、无 Registration No.</p></div>`;setupCanvas()}
function saveSettings(){for(let k of ['company','address','phone','bank','account','holder'])db.settings[k]=v('s_'+k);save();alert('已保存')}let canvas,ctx,down=false;function setupCanvas(){canvas=document.getElementById('sign');canvas.width=600;canvas.height=180;ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#273348';if(db.settings.signature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,600,180);im.src=db.settings.signature}const pos=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{down=true;signatureDirty=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};canvas.onpointerup=()=>down=false}function clearSign(){ctx.clearRect(0,0,600,180);signatureDirty=true}function saveSign(){db.settings.signature=canvas.toDataURL('image/png');save();alert('电子签名已保存')}function uploadChop(e){let f=e.target.files?.[0];if(!f)return;if(f.size>3000000)return alert('图片请小于 3MB');let r=new FileReader();r.onload=()=>{db.settings.chop=r.result;try{save();settings();alert('公司印章已保存')}catch(err){alert('储存空间不足，请使用较小的 PNG 图片')}};r.readAsDataURL(f)}function resetChop(){db.settings.chop='';save();settings()}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='auto-luxury-cashbill-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.invoices)||!Array.isArray(d.categories)||!d.settings)throw Error('无效备份');if(confirm('导入会覆盖本机现有资料，继续吗？')){db=d;save();render()}}).catch(()=>alert('备份文件无效'))}if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>reg.update().catch(()=>{})).catch(()=>{});}
try{
 render();
 window.__alBootReady=true;
 if(storageReadError){const notice=document.createElement('div');notice.className='card';notice.style.border='2px solid #e86c00';notice.textContent='注意：本机资料读取失败，请先不要创建新单或清除 Safari 网站资料。错误：'+storageReadError.message;app.prepend(notice);}
}catch(e){console.error(e);window.__showAutoLuxuryBootError(e.message||e)}
</script></body></html>

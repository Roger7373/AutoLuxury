const KEY='auto_luxury_invoice_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{settings:{company:'AUTO LUXURY CAR ACCESSORIES',address:'',phone:'',bank:'',account:'',holder:'',signature:''},customers:[],categories:['Car Accessories','Window Tint','Audio System','Lighting','Interior Accessories','Exterior Accessories','Safety Devices','Car Care','Installation Labour','Others'],rates:[],invoices:[],next:1};db.settings=db.settings||{};if(!('chop' in db.settings))db.settings.chop='';db.next=db.next||1;db.rates=Array.isArray(db.rates)?db.rates:[];db.categories=Array.isArray(db.categories)&&db.categories.length?db.categories:['Car Accessories','Window Tint','Audio System','Lighting','Installation Labour','Others'];db.customers=Array.isArray(db.customers)?db.customers:[];db.invoices=Array.isArray(db.invoices)?db.invoices:[];const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let page='home',draft=null,editing=null,preview=null,signatureDirty=false;const app=document.getElementById('app');const nav=document.getElementById('nav');const field=(label,id,value='',type='text')=>`<label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;const v=id=>document.getElementById(id)?.value||'';function go(p){page=p;render()}function render(){document.getElementById('heading').textContent=({home:'首页',invoices:'Invoice',rates:'商品价格库',customers:'客户管理',settings:'设置',editor:'编辑 Invoice',preview:'Invoice 预览'})[page];nav.innerHTML=['home','invoices','rates','customers','settings'].map((p,i)=>`<button onclick="go('${p}')">${['⌂ 首页','▤ Invoice','▦ 商品库','♙ 客户','⚙ 设置'][i]}</button>`).join('');({home:home,invoices:invoices,rates:rates,customers:customers,settings:settings,editor:editor,preview:showPreview})[page]();}
function home(){let docs=db.invoices.filter(x=>!x.void),month=new Date().toLocaleDateString('en-CA').slice(0,7),m=docs.filter(x=>(x.date||'').startsWith(month));app.innerHTML=`<div class="grid"><div class="card"><div class="muted">本月 Invoice 总额</div><h2>${rm(m.reduce((s,x)=>s+total(x),0))}</h2></div><div class="card"><div class="muted">本月开单数量</div><h2>${m.length}</h2></div></div><button onclick="newInvoice()">＋ 创建 Invoice</button><h2>最近单据</h2>${docs.slice(-5).reverse().map(x=>`<div class="card row"><div><b>${esc(x.no)}</b><div class="muted">${esc(x.customer)} · ${esc(x.date)}${x.plate?' · '+esc(x.plate):''}</div></div><button class="alt" onclick="openPreview('${x.id}')">${rm(total(x))}</button></div>`).join('')||'<div class="card muted">还没有 Invoice</div>'}`}
function invoices(){app.innerHTML=`<button onclick="newInvoice()">＋ 新建 Invoice</button><div class="card"><input id="find" placeholder="搜索编号、客户或车牌" oninput="invoiceRows()"></div><div id="invoiceRows"></div>`;invoiceRows()}
function invoiceRows(){let q=v('find').toLowerCase();document.getElementById('invoiceRows').innerHTML=db.invoices.slice().reverse().filter(x=>[x.no,x.customer,x.plate,x.carModel,x.project].join(' ').toLowerCase().includes(q)).map(x=>`<div class="card"><div class="row"><b>${esc(x.no)}</b><span class="pill">${x.void?'已作废':x.draft?'草稿':'正式'} · V${(x.versions?.length||0)+1}</span></div><p>${esc(x.customer||'未填写客户')}<br><span class="muted">${esc(x.plate||x.project||'')} · ${esc(x.date)}</span></p><div class="row"><b>${rm(total(x))}</b><span><button class="small alt" onclick="openPreview('${x.id}')">查看</button> <button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div></div>`).join('')||'<div class="card muted">没有单据</div>'}
function total(x){return Math.max(0,Math.round((x.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.rate||0),0)*100)/100-Number(x.discount||0))}function nextNo(){return 'INV-'+String(db.next).padStart(4,'0')}function newInvoice(){editing=null;draft={id:uid(),no:nextNo(),date:new Date().toLocaleDateString('en-CA'),customer:'',customerPhone:'',customerAddress:'',plate:'',carModel:'',year:'',remark:'',discount:0,items:[],draft:true,versions:[]};go('editor')}
function editInvoice(id){editing=id;draft=structuredClone(db.invoices.find(x=>x.id===id));go('editor')}
function duplicate(id){editing=null;draft=structuredClone(db.invoices.find(x=>x.id===id));draft.id=uid();draft.no=nextNo();draft.draft=true;draft.void=false;draft.versions=[];go('editor')}
function editor(){app.innerHTML=`<div class="card"><div class="row"><b>${esc(draft.no)}</b><span class="pill">${editing?'修改单据':'新单据'}</span></div><div class="grid">${field('Invoice No.','d_no',draft.no)}${field('Invoice Date','d_date',draft.date,'date')}</div><h2>BILL TO</h2><label>Customer Name</label><input id="d_customer" list="clients" value="${esc(draft.customer)}" onchange="pickCustomer()"><datalist id="clients">${db.customers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>${field('Phone No.','d_phone',draft.customerPhone||'')}<label>Customer Address</label><textarea id="d_address" rows="2">${esc(draft.customerAddress||'')}</textarea><h2>VEHICLE DETAILS <span class="muted">(Optional)</span></h2><div class="grid">${field('Plate No.','d_plate',draft.plate||'')}${field('Car Model','d_model',draft.carModel||'')}${field('Year','d_year',draft.year||'')}</div><label>Remark</label><textarea id="d_remark" rows="2">${esc(draft.remark||'')}</textarea></div><div class="card"><div class="row"><b>商品 / 安装服务</b><button class="small" type="button" id="manualAddBtn">＋ 手动添加</button></div><label>从商品价格库选择</label><select id="ratePick"><option value="">选择商品 / 服务</option>${db.rates.map((x,i)=>`<option value="${i}">${esc(x.description)}${x.partNo?' · '+esc(x.partNo):''} · ${rm(x.rate)}/${esc(x.unit||'pcs')}</option>`).join('')}</select><button class="alt" onclick="addRate()">加入商品库项目</button><div id="itemRows"></div></div><div class="card">${field('Discount (RM)','d_discount',draft.discount,'number')}<p class="total" id="d_total"></p><div class="row"><button class="alt" onclick="saveInvoice(true)">保存草稿</button><button onclick="saveInvoice(false)">保存正式 Invoice</button></div></div>`;itemRows();document.getElementById('manualAddBtn').addEventListener('click',addItem)}
function pickCustomer(){let c=db.customers.find(x=>x.name.toLowerCase()===v('d_customer').toLowerCase());if(c){document.getElementById('d_phone').value=c.phone||'';document.getElementById('d_address').value=c.address||''}}
function sync(){draft.no=v('d_no').trim()||draft.no;draft.date=v('d_date');draft.customer=v('d_customer');draft.customerPhone=v('d_phone');draft.customerAddress=v('d_address');draft.plate=v('d_plate');draft.carModel=v('d_model');draft.year=v('d_year');draft.remark=v('d_remark');draft.discount=Math.max(0,Number(v('d_discount'))||0);draft.items.forEach((x,i)=>{x.description=v('desc'+i);x.partNo=v('part'+i);x.brand=v('brand'+i);x.unit=v('unit'+i)||'pcs';x.qty=Math.max(0,Number(v('qty'+i))||0);x.rate=Math.max(0,Number(v('rate'+i))||0)})}
function itemRows(){document.getElementById('itemRows').innerHTML=draft.items.map((x,i)=>`<div class="item"><div class="row"><b>Item ${i+1}</b><span><button class="small alt" onclick="moveItem(${i},-1)">↑</button> <button class="small alt" onclick="moveItem(${i},1)">↓</button> <button class="small danger" onclick="removeItem(${i})">删除</button></span></div>${field('Description','desc'+i,x.description)}<div class="grid">${field('Part No. / SKU','part'+i,x.partNo||'')}${field('Brand','brand'+i,x.brand||'')}${field('Unit','unit'+i,x.unit||'pcs')}${field('Qty','qty'+i,x.qty,'number')}${field('Unit Price (RM)','rate'+i,x.rate,'number')}</div></div>`).join('');document.getElementById('itemRows').querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{sync();document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))}));document.getElementById('d_discount').oninput=()=>{sync();document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))};document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))}
function addItem(){try{if(!draft||!Array.isArray(draft.items))return alert('请先打开 Invoice 编辑页面');if(document.getElementById('d_date'))sync();draft.items.push({description:'',partNo:'',brand:'',unit:'pcs',qty:1,rate:0});itemRows();let el=document.getElementById('desc'+(draft.items.length-1));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus({preventScroll:true})}}catch(err){alert('手动添加错误：'+(err.message||err))}}
function addRate(){sync();let i=v('ratePick');if(i==='')return;let x=db.rates[Number(i)];draft.items.push({description:x.description,partNo:x.partNo||'',brand:x.brand||'',unit:x.unit||'pcs',qty:1,rate:Number(x.rate)||0,source:JSON.stringify({category:x.category,description:x.description,partNo:x.partNo||''})});itemRows()}
function removeItem(i){sync();draft.items.splice(i,1);itemRows()}
function moveItem(i,d){sync();let j=i+d;if(j<0||j>=draft.items.length)return;[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];itemRows()}
function saveInvoice(isDraft){sync();if(!draft.customer.trim())return alert('请填写客户名称');if(!draft.items.length)return alert('请至少添加一个商品 / 服务');if(draft.items.some(x=>!x.description.trim()))return alert('请填写全部商品名称');if(db.invoices.some(x=>x.id!==draft.id&&x.no===draft.no))return alert('Invoice 编号重复，请更改编号');for(let x of draft.items){if(x.source){let k;try{k=JSON.parse(x.source)}catch{continue}let r=db.rates.find(y=>y.category===k.category&&y.description===k.description&&(y.partNo||'')===(k.partNo||''));if(r&&Number(r.rate)!==Number(x.rate)&&confirm(`${x.description} 的价格已改为 ${rm(x.rate)}。是否同时更新商品价格库？`))r.rate=x.rate}}draft.draft=isDraft;let old=db.invoices.find(x=>x.id===draft.id);if(old){draft.versions=old.versions||[];draft.versions.push({...structuredClone(old),versions:undefined,archivedAt:new Date().toISOString()});db.invoices=db.invoices.map(x=>x.id===draft.id?structuredClone(draft):x)}else{db.next++;db.invoices.push(structuredClone(draft))}save();preview=draft.id;go('preview')}
function openPreview(id){preview=id;go('preview')}
function v2Estimate(it){let n=String(it.description||'').length+String(it.partNo||'').length+String(it.brand||'').length;return 35+Math.max(0,Math.ceil(n/62)-1)*15+Math.max(0,(String(it.description||'').match(/\n/g)||[]).length)*14}
function invoicePages(x){const arr=x.items||[],groups=[];let current=[],used=0;arr.forEach((it,index)=>{let h=v2Estimate(it),lim=groups.length?640:530;if(current.length && (used+h>lim||current.length>=14)){groups.push(current);current=[];used=0}current.push({it,index});used+=h});if(current.length||!groups.length)groups.push(current);let g=groups[groups.length-1];let size=g.reduce((s,r)=>s+v2Estimate(r.it),0);let limit=groups.length===1?345:475;let tail=[];while(g.length>1&&size>limit){let row=g.pop();tail.unshift(row);size-=v2Estimate(row.it)}if(tail.length)groups.push(tail);return groups}
function v2KV(label,val){return `<div class="v2-kv"><span>${label}</span><span>:</span><span>${esc(val||'')}</span></div>`}
function invoiceSheet(x,s,rows,p,totalPages){let last=p===totalPages-1;let contact=[s.address,s.phone].filter(Boolean).map(esc).join('<br>');let brand=`<div class="v2-head"><div class="v2-company"><img class="v2-brand-image" src="${V2_LOGO}" alt="AUTO LUXURY CAR ACCESSORIES"><div class="v2-company-details">${contact}</div></div><div class="v2-head-right"><img class="v2-car-banner" src="${V2_HEADER}" alt="INVOICE"><div class="v2-invoice-meta"><div class="v2-meta-grid"><span>Invoice No.</span><strong>${esc(x.no)}</strong><span>Date</span><span>${esc(x.date)}</span></div><div class="v2-date-page">Page ${p+1} of ${totalPages}</div></div></div></div>`;
let info=p===0?`<div class="v2-customer-wrap"><div class="v2-info"><div class="v2-info-title">BILL TO</div><div class="v2-info-body">${v2KV('Customer Name',x.customer)}${v2KV('Phone No.',x.customerPhone)}${v2KV('Address',x.customerAddress)}</div></div><div class="v2-info"><div class="v2-info-title">VEHICLE DETAILS <span style="font-size:10px;font-weight:normal">(Optional)</span></div><div class="v2-info-body">${v2KV('Plate No.',x.plate)}${v2KV('Car Model',x.carModel)}${v2KV('Year',x.year)}${v2KV('Remark',x.remark)}</div></div></div>`:'<div style="height:23px"></div>';
let table=`<table class="v2-items"><colgroup><col style="width:6%"><col style="width:30%"><col style="width:22%"><col style="width:9%"><col style="width:16%"><col style="width:17%"></colgroup><thead><tr><th>No.</th><th>Description</th><th>Part No. / Brand</th><th>Qty</th><th>Unit Price (RM)</th><th>Amount (RM)</th></tr></thead><tbody>${rows.map(({it,index})=>`<tr><td class="v2-num">${index+1}</td><td class="v2-desc">${esc(it.description)}${it.size&&!it.partNo?`<small>${esc(it.size)}</small>`:''}</td><td>${esc([it.partNo,it.brand].filter(Boolean).join(' / '))}</td><td class="v2-num">${esc(it.qty)}${it.unit&&it.unit!=='pcs'?`<small>${esc(it.unit)}</small>`:''}</td><td class="v2-money">${Number(it.rate||0).toFixed(2)}</td><td class="v2-money">${(Number(it.qty||0)*Number(it.rate||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
let subtotal=x.items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.rate||0),0);let bottom=last?`<div class="v2-bottom"><div class="v2-bottom-top"><div class="v2-remark-box"><div class="v2-box-title">REMARK</div><div class="v2-remark-body">${esc(x.remark||[x.project?'V1 Project: '+x.project:'',x.site?'V1 Site: '+x.site:''].filter(Boolean).join(' | '))}</div></div><div class="v2-totals"><div class="v2-total-line"><span>Subtotal</span><span>${rm(subtotal)}</span></div><div class="v2-total-line"><span>Discount</span><span>${rm(x.discount)}</span></div><div class="v2-grand-total"><span>Total Amount</span><span>${rm(total(x))}</span></div></div></div><div class="v2-last-bottom"><div class="v2-bank-box"><div class="v2-box-title">BANK DETAILS</div><div class="v2-bank-data"><strong>${esc(s.bank||'')}</strong>${v2KV('Account No.',s.account)}${v2KV('Account Name',s.holder)}</div></div><div class="v2-authorization"><div class="stamp-wrap">${s.chop?`<img class="stamp-chop" src="${s.chop}" alt="Company Chop">`:''}${s.signature?`<img class="stamp-signature" src="${s.signature}" alt="Signature">`:''}</div><div class="v2-sign-rule"></div><span>Authorized Signature &amp; Company Chop</span></div></div></div>`:`<div class="v2-continuation">Continued on next page →</div>`;
return `<section class="v18-page v2-page">${brand}${info}${table}${bottom}<img class="v2-foot-strip" src="${V2_FOOTER}" alt="Car Accessories · Window Tint · Audio System · Safety Devices · Car Care"></section>`}
function showPreview(){let x=db.invoices.find(y=>y.id===preview);if(!x)return go('invoices');let s=db.settings,groups=invoicePages(x);app.innerHTML=`<div class="no-print card row"><b>${esc(x.no)} · ${x.draft?'草稿':'正式'} ${x.void?'（已作废）':''}</b><span><button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div><div id="paper">${groups.map((g,p)=>invoiceSheet(x,s,g,p,groups.length)).join('')}</div><div class="card no-print"><button onclick="exportInvoicePDF()">导出 PDF</button> <button class="alt" onclick="printInvoice()">打印</button> <button class="alt" onclick="shareInvoice()">分享</button> <button class="alt" onclick="historyView('${x.id}')">历史版本 (${x.versions?.length||0})</button> <button class="danger" onclick="voidInvoice('${x.id}')">作废</button><p class="muted">V2 汽车主题 A4 · 汇总、银行与签名仅最后一页显示。</p></div>`;let host=document.getElementById('paper');let apply=()=>{let w=Math.min(794,host.clientWidth);let scale=w/794;host.querySelectorAll('.v18-page').forEach(el=>{el.style.transformOrigin='top left';el.style.transform=`scale(${scale})`;el.style.marginLeft='0';el.style.marginBottom=(1123*(scale-1)+18)+'px'});host.style.width='100%'};apply()}
let pdfLoading=null;
function loadPdfLibrary(){
 if(typeof window.html2canvas==='function' && window.jspdf?.jsPDF)return Promise.resolve();
 if(pdfLoading)return pdfLoading;
 const loadScript=(url,check)=>new Promise((resolve,reject)=>{
  if(check())return resolve();
  const script=document.createElement('script');script.src=url;
  script.onload=()=>check()?resolve():reject(Error('PDF library initialization failed'));
  script.onerror=()=>reject(Error('PDF library download failed; check internet connection'));
  document.head.appendChild(script);
 });
 pdfLoading=Promise.all([
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>typeof window.html2canvas==='function'),
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>typeof window.jspdf?.jsPDF==='function')
 ]).catch(e=>{pdfLoading=null;throw e});
 return pdfLoading;
}
async function buildInvoicePDF(){
 const x=db.invoices.find(y=>y.id===preview);if(!x)throw Error('请先打开 Invoice 预览');await loadPdfLibrary();
 const frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.style.cssText='position:fixed;left:0;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none;z-index:-1';document.body.appendChild(frame);
 try{const doc=frame.contentDocument;const css=document.querySelector('style').textContent;
 doc.open();doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style><style>html,body{margin:0!important;padding:0!important;width:794px!important;background:white!important}.v18-page{width:794px!important;height:1123px!important;box-shadow:none!important;margin:0!important;transform:none!important}.v18-page .v18-last{bottom:38px!important;left:40px!important;right:40px!important}</style></head><body></body></html>');doc.close();
 const groups=invoicePages(x),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
 for(let i=0;i<groups.length;i++){doc.body.innerHTML=invoiceSheet(x,db.settings,groups[i],i,groups.length);let sheet=doc.querySelector('.v18-page');await Promise.all(Array.from(sheet.querySelectorAll('img')).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));if(doc.fonts?.ready)await doc.fonts.ready;
 const canvas=await window.html2canvas(sheet,{scale:1.7,backgroundColor:'#fff',useCORS:true,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123});if(i)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',0,0,210,297);
 }
 return {blob:pdf.output('blob'),filename:x.no+'.pdf'};
 }finally{frame.remove()}
}
async function exportInvoicePDF(){
 const btn=document.querySelector('button[onclick="exportInvoicePDF()"]');
 if(btn){btn.disabled=true;btn.textContent='正在生成 PDF…'}
 try{
  const {blob,filename}=await buildInvoicePDF();
  const file=new File([blob],filename,{type:'application/pdf'});
  if(navigator.canShare?.({files:[file]})&&navigator.share){
   try{await navigator.share({files:[file],title:filename});return}catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){console.error(e);alert('PDF 导出失败：'+e.message+'。请在 Safari 中重试。')}
 finally{if(btn){btn.disabled=false;btn.textContent='导出 PDF'}}
}
async function printInvoice(){
 // Use the same PDF renderer for print, avoiding the separate iPhone print CSS path.
 try{
  const {blob}=await buildInvoicePDF();
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(e){alert('打开打印 PDF 失败：'+e.message)}
}
function shareInvoice(){exportInvoicePDF()}function voidInvoice(id){if(!confirm('确定作废此 Invoice？编号会保留。'))return;let x=db.invoices.find(y=>y.id===id);x.void=true;save();render()}function historyView(id){let x=db.invoices.find(y=>y.id===id);alert((x.versions||[]).map((y,i)=>`V${i+1} · ${y.archivedAt||y.date} · ${rm(total(y))}`).join('\n')||'目前没有历史版本')}

function rateRows(){let c=v('catSel'),q=v('catalogSearch').toLowerCase();document.getElementById('rateRows').innerHTML=db.rates.map((x,i)=>({...x,i})).filter(x=>x.category===c&&[x.description,x.partNo,x.brand].join(' ').toLowerCase().includes(q)).map(x=>`<div class="item row"><div><b>${esc(x.description)}</b><div class="muted">${esc([x.partNo,x.brand].filter(Boolean).join(' / '))} · ${rm(x.rate)}/${esc(x.unit||'pcs')}</div></div><span><button class="small alt" onclick="editRate(${x.i})">修改</button> <button class="small danger" onclick="delRate(${x.i})">删除</button></span></div>`).join('')||'<p class="muted">暂无商品</p>'}

function renameCategory(){let c=v('catSel'),n=prompt('修改分类名称',c);if(!n?.trim()||n===c)return;db.categories=db.categories.map(x=>x===c?n:x);db.rates.forEach(x=>{if(x.category===c)x.category=n});save();rates()}

function editRate(i){let x=db.rates[i],n=prompt('Product Name',x.description);if(n===null)return;x.description=n;x.partNo=prompt('Part No. / SKU',x.partNo||'')??x.partNo;x.brand=prompt('Brand',x.brand||'')??x.brand;x.unit=prompt('Unit',x.unit||'pcs')??x.unit;x.rate=Math.max(0,Number(prompt('Unit Price (RM)',x.rate)??x.rate)||0);save();rates()}

function editCustomer(i){let x=db.customers[i];x.name=prompt('客户名称',x.name)??x.name;x.phone=prompt('电话',x.phone)??x.phone;x.address=prompt('地址',x.address)??x.address;save();customers()}
function deleteCustomer(i){if(confirm('删除客户？')){db.customers.splice(i,1);save();customers()}}
function settings(){let s=db.settings;app.innerHTML=`<div class="card"><h2>店铺资料</h2><p class="muted">已使用正式橙黑色 AUTO LUXURY Logo。地址与电话由你自己填写，不会使用样板上的示例。</p>${field('Company Name','s_company',s.company)}<label>Address</label><textarea id="s_address">${esc(s.address)}</textarea>${field('Contact Number','s_phone',s.phone)}<h2>银行资料</h2>${field('Bank Name','s_bank',s.bank)}${field('Account Number','s_account',s.account)}${field('Account Holder','s_holder',s.holder)}<button onclick="saveSettings()">保存设置</button></div><div class="card"><h2>电子签名</h2><p class="muted">用手指在下方签名，保存后自动显示在 Invoice PDF 中。</p><canvas id="sign"></canvas><div class="row"><button class="alt" onclick="clearSign()">清除重签</button><button onclick="saveSign()">保存签名</button></div></div><div class="card"><h2>Company Chop 公司印章</h2><p class="muted">上传你自己的透明 PNG 公司印章。未上传时不会出现示例蓝色印章。</p><div style="max-width:310px;background:#fff;border:1px dashed #ddd;padding:12px"><img id="chopPreview" src="${s.chop||''}" style="width:100%;height:auto"></div><label>上传印章</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadChop(event)"><button class="alt" onclick="resetChop()">清除公司印章</button></div><div class="card"><h2>本机资料备份</h2><p class="muted">V2 继续读取 V1 本地资料，但请在更新前先导出备份 JSON。换手机或清除 Safari 网站数据可能造成资料丢失。</p><button onclick="backup()">导出备份 JSON</button> <label>导入备份 JSON</label><input type="file" accept="application/json" onchange="restore(event)"></div><div class="card"><b>下一个 Invoice：${nextNo()}</b><p class="muted">永久连续编号，不包含年份。无税务、无付款状态、无 Registration No.</p></div>`;setupCanvas()}
function saveSettings(){for(let k of ['company','address','phone','bank','account','holder'])db.settings[k]=v('s_'+k);save();alert('已保存')}let canvas,ctx,down=false;function setupCanvas(){canvas=document.getElementById('sign');canvas.width=600;canvas.height=180;ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#273348';if(db.settings.signature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,600,180);im.src=db.settings.signature}const pos=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{down=true;signatureDirty=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};canvas.onpointerup=()=>down=false}function clearSign(){ctx.clearRect(0,0,600,180);signatureDirty=true}function saveSign(){db.settings.signature=canvas.toDataURL('image/png');save();alert('电子签名已保存')}function uploadChop(e){let f=e.target.files?.[0];if(!f)return;if(f.size>3000000)return alert('图片请小于 3MB');let r=new FileReader();r.onload=()=>{db.settings.chop=r.result;try{save();settings();alert('公司印章已保存')}catch(err){alert('储存空间不足，请使用较小的 PNG 图片')}};r.readAsDataURL(f)}function resetChop(){db.settings.chop='';save();settings()}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='auto-luxury-invoice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.invoices)||!Array.isArray(d.categories)||!d.settings)throw Error('无效备份');if(confirm('导入会覆盖本机现有资料，继续吗？')){db=d;save();render()}}).catch(()=>alert('备份文件无效'))}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});save();render();
</script></body></html>
